<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <title>Warehouse IoT & Forklift Management System</title>
    <!-- Modern Typography: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body class="bg-[#0b0f19] text-gray-100 font-['Inter',sans-serif] antialiased selection:bg-blue-600 selection:text-white overflow-x-hidden">
